backend:
  name: github
  repo: 1337misterzero/blog
  branch: main
  auth_methods:
    - token

site_url: https://1337misterzero.github.io/blog/
display_url: https://1337misterzero.github.io/blog/

media_folder: /static/images
public_folder: /blog/images

publish_mode: simple

collections:

  - name: posts
    label: Posts
    label_singular: Post
    folder: /content/posts
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    preview_path: /posts/{{slug}}/

    fields:

      - name: title
        label: Title
        widget: string

      - name: date
        label: Date
        widget: datetime
        required: true

      - name: description
        label: Description
        widget: text
        required: false

      - name: image
        label: Cover
        widget: image
        required: false

      - name: category
        label: Category
        widget: select
        required: false
        options:
          - Systems
          - Networking
          - Linux
          - Security
          - Programming
          - Engineering
          - Notes
          - Projects

      - name: tags
        label: Tags
        widget: list
        required: false
        field:
          label: Tag
          name: tag
          widget: string

      - name: featured
        label: Featured
        widget: boolean
        default: false
        required: false

      - name: body
        label: Content
        widget: richtext

  - name: pages
    label: Pages
    files:

      - name: about
        label: About
        file: /content/about.md

        fields:
          - name: title
            label: Title
            widget: string

          - name: description
            label: Description
            widget: text
            required: false

          - name: body
            label: Content
            widget: richtext
