<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>admin — zero</title>
<style>
:root{
  --bg:#07070b;--panel:#0b0a10;--panel2:#0f0d15;--text:#f1edf5;
  --muted:#8b8494;--muted2:#5f5969;--line:#211c2a;--bright:#34283f;
  --purple:#a855f7;--blue:#00d9ff;--red:#ff6b9b;--green:#65f3ae;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:
 radial-gradient(circle at 10% 0,rgba(0,217,255,.045),transparent 26%),
 radial-gradient(circle at 90% 0,rgba(168,85,247,.065),transparent 30%),var(--bg)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.shell{width:min(1200px,calc(100% - 28px));margin:auto;padding:20px 0 80px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(7,7,11,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.topbar-inner{width:min(1200px,calc(100% - 28px));min-height:64px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{font:800 21px/1 "JetBrains Mono",monospace;letter-spacing:-1px}
.brand span{color:var(--purple)}
.actions{display:flex;gap:8px;align-items:center}
.btn,.icon-btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:8px;font:11px "JetBrains Mono",monospace}
.btn:hover,.icon-btn:hover{border-color:var(--purple);box-shadow:0 0 20px rgba(168,85,247,.08)}
.btn.primary{border-color:rgba(168,85,247,.6);background:linear-gradient(135deg,rgba(168,85,247,.24),rgba(0,217,255,.06))}
.btn.danger{color:var(--red)}
.hidden{display:none!important}
.login{width:min(420px,100%);margin:12vh auto 0}
.panel{border:1px solid var(--line);background:rgba(11,10,16,.88);padding:18px;border-radius:12px;box-shadow:0 18px 55px rgba(0,0,0,.28)}
.title{font:800 26px "JetBrains Mono",monospace;margin:0 0 5px}
.sub{color:var(--muted);font-size:12px;margin:0 0 20px}
.field{margin:0 0 13px}
label{display:block;margin:0 0 6px;color:var(--muted);font:9px "JetBrains Mono",monospace;letter-spacing:1px;text-transform:uppercase}
input,textarea,select{width:100%;border:1px solid var(--line);outline:none;background:#050408;color:var(--text);padding:10px 11px;border-radius:8px}
textarea{min-height:280px;resize:vertical;font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.7}
input:focus,textarea:focus,select:focus{border-color:rgba(0,217,255,.45);box-shadow:0 0 0 3px rgba(0,217,255,.05)}
.status{margin-top:10px;color:var(--muted);font:10px "JetBrains Mono",monospace}
.ok{color:var(--green)}.err{color:var(--red)}
.layout{display:grid;grid-template-columns:320px 1fr;gap:14px}
.sidebar,.editor{min-width:0}
.sidebar{display:flex;flex-direction:column;gap:12px}
.search{display:flex;gap:8px}
.search input{min-width:0}
.list{border:1px solid var(--line);background:rgba(11,10,16,.82);border-radius:10px;overflow:auto;max-height:68vh}
.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:12px;background:transparent;color:var(--text)}
.row:last-child{border-bottom:0}
.row:hover,.row.active{background:linear-gradient(90deg,rgba(168,85,247,.08),rgba(0,217,255,.025))}
.row strong{display:block;font:11px "JetBrains Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;margin-top:4px;color:var(--muted2);font-size:10px}
.empty{padding:18px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.editor .panel{margin-bottom:12px}
.filebar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.path{color:var(--muted);font:10px "JetBrains Mono",monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{border:0;background:transparent;color:var(--muted);padding:9px 10px;font:10px "JetBrains Mono",monospace}
.tab.active{color:#fff;border-bottom:1px solid var(--blue)}
.preview{border:1px solid var(--line);border-radius:9px;background:#050408;padding:16px;min-height:280px;white-space:pre-wrap;overflow:auto}
.muted{color:var(--muted)}
.notice{padding:11px 12px;border:1px dashed var(--bright);border-radius:9px;color:var(--muted);font-size:12px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.list{max-height:340px}}
@media(max-width:560px){.grid2{grid-template-columns:1fr}.shell{width:calc(100% - 18px)}.topbar-inner{width:calc(100% - 18px)}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">zero <span>/ admin</span></div>
    <div class="actions">
      <a class="btn" href="/blog/">back</a>
      <button class="btn" id="logoutBtn">logout</button>
    </div>
  </div>
</header>

<main class="shell">
  <section id="loginPanel" class="login panel">
    <h1 class="title">admin access</h1>
    <p class="sub">Password-only access. No GitHub token is exposed in the browser.</p>
    <div class="field">
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <button class="btn primary" id="loginBtn">enter</button>
    <div id="loginStatus" class="status"></div>
  </section>

  <section id="app" class="hidden">
    <div class="layout">
      <aside class="sidebar">
        <div class="panel">
          <div class="toolbar">
            <button class="btn primary" id="newPostBtn">new post</button>
            <button class="btn" id="newFileBtn">new file</button>
          </div>
          <div class="search">
            <input id="search" placeholder="search posts...">
            <button class="btn" id="refreshBtn">↻</button>
          </div>
        </div>

        <div class="list" id="postList"></div>

        <div class="panel">
          <div class="tabs">
            <button class="tab active" data-tab="posts">posts</button>
            <button class="tab" data-tab="files">site files</button>
          </div>
          <div id="fileList"></div>
        </div>
      </aside>

      <section class="editor">
        <div id="editorPanel" class="panel hidden">
          <div class="filebar">
            <span class="path" id="editorPath">new post</span>
            <div class="toolbar">
              <button class="btn" id="previewBtn">preview</button>
              <button class="btn primary" id="saveBtn">save</button>
              <button class="btn danger" id="deleteBtn">delete</button>
            </div>
          </div>

          <div id="postFields">
            <div class="grid2">
              <div class="field"><label>Title</label><input id="title"></div>
              <div class="field"><label>Date</label><input id="date" type="datetime-local"></div>
            </div>
            <div class="field"><label>Slug</label><input id="slug"></div>
            <div class="field"><label>Description / preview</label><input id="description" maxlength="220"></div>
            <div class="field"><label>Tags</label><input id="tags" placeholder="linux, networks, security"></div>
            <div class="field"><label>Markdown</label><textarea id="body"></textarea></div>
          </div>

          <div id="fileFields" class="hidden">
            <div class="field"><label>Repository path</label><input id="filePath" placeholder="hugo.toml"></div>
            <div class="field"><label>File content</label><textarea id="fileBody"></textarea></div>
          </div>

          <div id="preview" class="preview hidden"></div>
          <div id="saveStatus" class="status"></div>
        </div>

        <div id="emptyEditor" class="panel">
          <div class="notice">Select a post or a site file. The editor can update post content and the editable files that control this site.</div>
        </div>
      </section>
    </div>
  </section>
</main>

<script>
window.ZERO_ADMIN={apiBase:"https://zero-blog-admin.vercel.app"};
</script>
<script>
const API=String(window.ZERO_ADMIN?.apiBase||"").replace(/\/$/,"");
const $=id=>document.getElementById(id);
const state={posts:[],files:[],current:null,mode:"post",token:sessionStorage.getItem("zero_admin_api_token")||""};

function setStatus(text,cls="status"){const el=$("saveStatus");el.textContent=text;el.className=cls}
async function api(path,options={}){
  const headers={"Content-Type":"application/json",...(options.headers||{})};
  if(state.token)headers.Authorization="Bearer "+state.token;
  const res=await fetch(API+path,{headers,...options});
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||("HTTP "+res.status));
  return data;
}
function esc(v){return String(v||"")}
function slugify(v){return v.toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"post"}
function parseFrontmatter(text){
  const m=text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if(!m)return {front:{},body:text};
  const front={};
  for(const line of m[1].split("\n")){
    const i=line.indexOf(":");
    if(i<1)continue;
    front[line.slice(0,i).trim()]=line.slice(i+1).trim().replace(/^["']|["']$/g,"");
  }
  return {front,body:m[2].trim()};
}
function buildFront(){
  const title=$("title").value.trim(),date=$("date").value,desc=$("description").value.trim();
  const tags=$("tags").value.split(",").map(x=>x.trim()).filter(Boolean);
  return [
    "---",
    "title: "+JSON.stringify(title),
    "date: "+JSON.stringify(date?new Date(date).toISOString():new Date().toISOString()),
    "description: "+JSON.stringify(desc),
    "draft: false",
    "tags:",
    ...(tags.length?tags.map(t=>"  - "+JSON.stringify(t)):["  -"]),
    "---","",$("body").value.trim(),""
  ].join("\n");
}
function showEditor(){ $("emptyEditor").classList.add("hidden"); $("editorPanel").classList.remove("hidden") }
function setMode(mode){
  state.mode=mode;
  $("postFields").classList.toggle("hidden",mode!=="post");
  $("fileFields").classList.toggle("hidden",mode!=="file");
  $("deleteBtn").classList.toggle("hidden",!state.current);
}
function renderPosts(){
  const q=$("search").value.toLowerCase();
  const list=$("postList");
  list.innerHTML="";
  const items=state.posts.filter(p=>(p.title+" "+p.path).toLowerCase().includes(q));
  if(!items.length){list.innerHTML='<div class="empty">No posts.</div>';return}
  for(const p of items){
    const b=document.createElement("button"); b.className="row"+(state.current?.path===p.path?" active":"");
    b.innerHTML="<strong>"+esc(p.title||p.path)+"</strong><small>"+esc(p.date||"")+" · "+esc(p.path)+"</small>";
    b.onclick=()=>openPost(p.path); list.appendChild(b);
  }
}
function renderFiles(){
  const list=$("fileList"); list.innerHTML="";
  for(const p of state.files){
    const b=document.createElement("button");b.className="row";
    b.innerHTML="<strong>"+esc(p)+"</strong>";
    b.onclick=()=>openFile(p);
    list.appendChild(b);
  }
}
async function loadPosts(){
  const data=await api("/api/posts");
  state.posts=data.posts||[];
  renderPosts();
}
async function loadFiles(){
  const data=await api("/api/files");
  state.files=data.files||[];
  renderFiles();
}
async function openPost(path){
  const data=await api("/api/file?path="+encodeURIComponent(path));
  const f=parseFrontmatter(data.content);
  state.current={path,sha:data.sha};
  setMode("post");showEditor();
  $("editorPath").textContent=path;
  $("title").value=f.front.title||"";
  $("date").value=f.front.date?new Date(f.front.date).toISOString().slice(0,16):"";
  $("slug").value=path.replace(/^content\/posts\//,"").replace(/\.md$/,"");
  $("description").value=f.front.description||"";
  $("tags").value="";
  $("body").value=f.body||"";
  $("filePath").value="";$("fileBody").value="";
  $("preview").classList.add("hidden");
  $("deleteBtn").classList.remove("hidden");
  setStatus("");
  renderPosts();
}
async function openFile(path){
  const data=await api("/api/file?path="+encodeURIComponent(path));
  state.current={path,sha:data.sha};
  setMode("file");showEditor();
  $("editorPath").textContent=path;
  $("filePath").value=path;
  $("fileBody").value=data.content||"";
  $("preview").classList.add("hidden");
  $("deleteBtn").classList.remove("hidden");
  setStatus("");
  renderPosts();
}
$("newPostBtn").onclick=()=>{
  state.current=null;setMode("post");showEditor();
  $("editorPath").textContent="new post";
  $("title").value="";$("date").value=new Date().toISOString().slice(0,16);$("slug").value="";
  $("description").value="";$("tags").value="";$("body").value="";
  $("deleteBtn").classList.add("hidden");$("preview").classList.add("hidden");setStatus("");
};
$("newFileBtn").onclick=()=>{
  state.current=null;setMode("file");showEditor();
  $("editorPath").textContent="new file";$("filePath").value="";$("fileBody").value="";
  $("deleteBtn").classList.add("hidden");$("preview").classList.add("hidden");setStatus("");
};
$("saveBtn").onclick=async()=>{
  try{
    setStatus("saving...");
    let path,content;
    if(state.mode==="post"){
      const slug=slugify($("slug").value.trim()||$("title").value.trim());
      if(!$("title").value.trim())throw new Error("Title required.");
      path="content/posts/"+slug+".md";
      content=buildFront();
    }else{
      path=$("filePath").value.trim();
      content=$("fileBody").value;
      if(!path)throw new Error("File path required.");
    }
    const payload={path,content,sha:state.current?.sha||null,message:(state.current?"update ":"create ")+path};
    const data=await api("/api/file",{method:"PUT",body:JSON.stringify(payload)});
    state.current={path,sha:data.sha};
    $("editorPath").textContent=path;
    setStatus("saved · commit "+data.commit.slice(0,7),"status ok");
    await loadPosts();await loadFiles();
  }catch(e){setStatus(e.message,"status err")}
};
$("deleteBtn").onclick=async()=>{
  if(!state.current)return;
  if(!confirm("Delete "+state.current.path+"?"))return;
  try{
    setStatus("deleting...");
    await api("/api/file",{method:"DELETE",body:JSON.stringify({path:state.current.path,sha:state.current.sha,message:"delete "+state.current.path})});
    state.current=null;$("editorPanel").classList.add("hidden");$("emptyEditor").classList.remove("hidden");
    await loadPosts();await loadFiles();
  }catch(e){setStatus(e.message,"status err")}
};
$("previewBtn").onclick=()=>{
  if(state.mode!=="post"){return}
  const title=$("title").value,desc=$("description").value,body=$("body").value;
  $("preview").textContent=(title+"\n\n"+(desc?desc+"\n\n":"")+body);
  $("preview").classList.toggle("hidden");
};
$("refreshBtn").onclick=()=>Promise.all([loadPosts(),loadFiles()]).catch(e=>setStatus(e.message,"status err"));
$("search").oninput=renderPosts;
document.querySelectorAll(".tab").forEach(tab=>tab.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  tab.classList.add("active");
  const mode=tab.dataset.tab;
  $("postList").classList.toggle("hidden",mode!=="posts");
  $("fileList").classList.toggle("hidden",mode!=="files");
});
$("logoutBtn").onclick=()=>{
  state.token="";
  sessionStorage.removeItem("zero_admin_api_token");
  $("app").classList.add("hidden");
  $("loginPanel").classList.remove("hidden");
};
$("loginBtn").onclick=async()=>{
  const status=$("loginStatus");
  try{
    if(!API||API.includes("YOUR-WORKER-URL"))throw new Error("Admin API is not configured yet.");
    const login=await api("/login",{method:"POST",body:JSON.stringify({password:$("password").value})});
    state.token=login.token;
    sessionStorage.setItem("zero_admin_api_token",state.token);
    $("loginPanel").classList.add("hidden");$("app").classList.remove("hidden");
    await Promise.all([loadPosts(),loadFiles()]);
  }catch(e){status.textContent=e.message;status.className="status err"}
};
if(!API){
  $("loginStatus").textContent="Admin API unavailable.";
  $("loginStatus").className="status err";
}
</script>
</body>
</html>
