{{ define "main" }}
<article class="article wrap">

  <div class="article-meta">
    <a class="back" href="{{ "/posts/" | relURL }}">← posts</a>
    <span>{{ .Date.Format "02 Jan 2006" }}</span>
  </div>

  <h1 class="article-title glitch" data-text="{{ .Title }}">{{ .Title }}</h1>

  {{ with .Description }}
    <p class="article-description">{{ . }}</p>
  {{ end }}

  <div class="article-content">
    {{ .Content }}
  </div>

  <nav class="post-nav" aria-label="Post navigation">
    {{ with .PrevInSection }}
      <a href="{{ .RelPermalink }}">
        <small>← previous</small>
        <strong>{{ .Title }}</strong>
      </a>
    {{ else }}
      <span></span>
    {{ end }}

    {{ with .NextInSection }}
      <a class="next" href="{{ .RelPermalink }}">
        <small>next →</small>
        <strong>{{ .Title }}</strong>
      </a>
    {{ else }}
      <span></span>
    {{ end }}
  </nav>

  <a class="back" href="{{ "/posts/" | relURL }}">← back to posts</a>
</article>
{{ end }}
