{{ define "main" }}
<article class="article wrap">
  <div class="post-date">{{ .Date.Format "02 Jan 2006" }}</div>
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="article-description">{{ . }}</p>{{ end }}
  <div class="article-content">{{ .Content }}</div>
  <a class="back" href="{{ "/posts/" | relURL }}">← posts</a>
</article>
{{ end }}
