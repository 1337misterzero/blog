{{ define "main" }}
<section class="feed wrap" id="single-post-page">
  <article class="post post-reader" id="post-reader">
    <a class="back post-back" href="/blog/">← back</a>

    <div class="post-date">{{ .Date.Format "02 Jan 2006" }}</div>

    <h1 class="post-title glitch article-title" data-text="{{ .Title }}">{{ .Title }}</h1>

    {{ with .Description }}
      <p class="preview post-description">{{ . }}</p>
    {{ end }}

    <div class="post-content">
      {{ .Content }}
    </div>

    <section class="discussion" aria-label="comments">
      <div class="discussion-heading">
        <span>THREAD</span>
        <small>github / comments</small>
      </div>
      <div class="utterances-host" data-post-path="{{ .RelPermalink }}" data-post-title="{{ .Title }}"></div>
    </section>
  </article>
</section>
{{ end }}
