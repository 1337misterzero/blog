<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ .Title }} // zero_</title>
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
</head>
<body>
<header>
<a class="logo" href="{{ "/" | relURL }}">zero_</a>
<nav>
<a href="{{ "/" | relURL }}">home</a>
<a href="{{ "/posts/" | relURL }}">posts</a>
<a href="{{ "/about/" | relURL }}">about</a>
</nav>
</header>
<main>
<section class="section archive">
<h1>TRANSMISSIONS_</h1>
{{ range .Pages.ByDate.Reverse }}
<article>
<div class="date">{{ .Date.Format "2006.01.02" }}</div>
<h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
<p>{{ .Description }}</p>
<a class="read" href="{{ .RelPermalink }}">READ →</a>
</article>
{{ end }}
</section>
</main>
<footer>zero_ // end transmission</footer>
</body>
</html>
