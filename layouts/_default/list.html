{{ define "main" }}
{{ $p := .Paginate (.Pages.ByDate.Reverse) 5 }}

<section class="page-head wrap">
  <h1>posts</h1>
</section>

<section class="feed wrap" id="post-feed" data-next="{{ if $p.HasNext }}{{ $p.Next.URL }}{{ end }}">
  {{ range $p.Pages }}
    <article class="post">
      <div class="post-date">{{ .Date.Format "02 Jan 2006" }}</div>

      <h1 class="post-title">
        <a class="glitch-hover" data-text="{{ .Title }}" href="{{ .RelPermalink }}">{{ .Title }}</a>
      </h1>

      <p class="preview">
        {{ with .Description }}
          {{ . }}
        {{ else }}
          {{ .Summary | plainify | truncate 220 }}
        {{ end }}
      </p>
    </article>
  {{ else }}
    <div class="empty">No posts.</div>
  {{ end }}

  <div id="load-more" class="load-more" aria-hidden="true"></div>
</section>
{{ end }}
