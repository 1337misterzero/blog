<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} // zero</title>
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
</head>

<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}">zero</a>
    <nav>
      <a href="{{ "/" | relURL }}">home</a>
      <a href="{{ "/posts/" | relURL }}">posts</a>
      <a href="{{ "/about/" | relURL }}">about</a>
    </nav>
  </div>
</header>

<main class="wrap page">
  <div class="eyebrow">ARCHIVE</div>
  <h1>posts</h1>

  <div class="archive">
    {{ range .Pages.ByDate.Reverse }}
      <article class="archive-item">
        <div class="post-meta">{{ .Date.Format "2006.01.02" }}</div>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        {{ with .Description }}<p>{{ . }}</p>{{ end }}
        <a class="read" href="{{ .RelPermalink }}">read →</a>
      </article>
    {{ else }}
      <p>No posts found.</p>
    {{ end }}
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">zero // end transmission</div>
</footer>
</body>
</html>
