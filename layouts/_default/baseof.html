<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  <meta name="theme-color" content="#07070b">
  <title>{{ if .IsHome }}zero{{ else }}{{ .Title }} — zero{{ end }}</title>
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
</head>

<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand glitch" data-text="zero" href="/blog/" aria-label="zero home">zero</a>
      <div class="header-tools">
        <span class="header-signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <a class="settings-link glitch-hover" data-text="⚙" href="/blog/admin/" aria-label="admin settings">⚙</a>
      </div>
  </header>

  <main>{{ block "main" . }}{{ end }}</main>

  <section class="radio-dock" aria-label="Metal and rock radio">
    <div class="radio-header">
      <span class="radio-led" aria-hidden="true"></span>
      <span>ANTYRADIO // METAL / ROCK</span>
      <a href="https://retunefm.com/radio/antyradio/" target="_blank" rel="noopener noreferrer">OPEN ↗</a>
    </div>
    <iframe
      src="https://retunefm.com/embed/antyradio"
      title="Antyradio — metal and rock radio"
      width="100%"
      height="92"
      frameborder="0"
      scrolling="no"
      loading="lazy"
      allow="autoplay">
    </iframe>
  </section>

  <script src="{{ "js/infinite.js" | relURL }}" defer></script>
  <script src="{{ "js/comments.js" | relURL }}" defer></script>
</body>
</html>
